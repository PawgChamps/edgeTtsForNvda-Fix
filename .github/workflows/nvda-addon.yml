name: Build NVDA add-on

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build add-on package
        id: build
        run: |
          path=$(python build_addon.py dist)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$path" .nvda-addon | sed 's/^edgeTtsForNvda-//')" >> "$GITHUB_OUTPUT"

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: ${{ steps.build.outputs.path }}

      - name: Publish add-on to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-371b5910-agg0pz')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nvda-v${{ steps.build.outputs.version }}
          name: Edge TTS for NVDA ${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: ${{ steps.build.outputs.path }}
          body: |
            NVDA add-on with the v2 Sec-MS-GEC token fix (resolves HTTP 403 from Microsoft's Read Aloud service), automatic recovery from dropped connections, and clock-skew correction.

            Built from ${{ github.sha }}. Open the `.nvda-addon` file with NVDA running to install, then restart NVDA.
